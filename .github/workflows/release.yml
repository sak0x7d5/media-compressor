# Builds, signs and publishes a release when a version tag is pushed.
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# That is the whole release process. The workflow produces the installer and a
# `latest.json` describing it, which is the file installed copies of the app
# check to discover that a newer version exists.
#
# Before the first release, two things must be true:
#
#   1. The repository is public. Downloads from a private repository require a
#      login, so nobody's app could fetch the update.
#   2. The secret TAURI_SIGNING_PRIVATE_KEY is set, holding the contents of the
#      private key file. Updates are refused by the app unless signed with it.
#      Settings -> Secrets and variables -> Actions -> New repository secret.
#
# The tag must match the version in tauri.conf.json. That version is what ends
# up in latest.json, so tagging v0.2.0 while the config still says 0.1.0 would
# publish a release that every installed copy reads as "no newer version" — a
# release nobody ever receives. The check below refuses that rather than let it
# ship quietly.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets the workflow be run by hand from the Actions tab to check it works,
  # without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds are slow from cold; this makes repeat releases minutes
      # rather than tens of minutes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # A release that fails its own tests is worse than a late release.
      - run: pnpm check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The one mistake this process can make silently. Catch it before the
      # 20-minute build rather than after the release is already published.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          configured=$(node -p "require('./src-tauri/tauri.conf.json').version")

          if [ "$tagged" != "$configured" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $configured."
            echo "::error::latest.json would advertise $configured, so no installed copy would take this update."
            echo "::error::Set the version in src-tauri/tauri.conf.json, src-tauri/Cargo.toml and package.json to $tagged, then re-tag."
            exit 1
          fi

          # Not fatal on their own — only tauri.conf.json reaches latest.json —
          # but drift here is how the next release ends up mismatched.
          for file in package.json src-tauri/Cargo.toml; do
            case "$file" in
              *.json) found=$(node -p "require('./$file').version") ;;
              *)      found=$(grep -m1 '^version' "$file" | cut -d'"' -f2) ;;
            esac
            [ "$found" = "$tagged" ] || echo "::warning::$file says $found, not $tagged"
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated without a password, so this is deliberately
          # empty rather than missing — the tool expects the variable to exist.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          # Empty on a manual run, which is what makes it build-only: given no
          # tag, the action produces the installer without creating a release.
          # Passing github.ref_name unconditionally would tag a draft release
          # after whatever branch the run started from.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Media Compressor {0}', github.ref_name) || '' }}
          releaseBody: 'Installed copies will offer this update automatically.'
          releaseDraft: true
          prerelease: false

      # A manual run builds the installer and then had nowhere to put it, so it
      # could only ever prove the build compiled. Uploading it makes
      # `workflow_dispatch` the way to get a real installer for any branch
      # without cutting a release — which is what running unreleased code needs.
      # Skipped on a tag, where the release assets already carry the installer.
      - name: Upload the installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: media-compressor-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
